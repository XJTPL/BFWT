<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The BFWT Website</title>
  <script src="/BFWT/init.js"></script>
  <style>
    .body {
      padding: 8px;
    }
    .shiny {
      padding: 6px;
      border: 2px solid transparent;
      border-radius: 6px;
      background:
        linear-gradient(to top, #007fff 50%, #7faad4) padding-box,
        linear-gradient(to bottom, #007fff, #005fbf) border-box;
      font-size: 24px;
      text-align: center;
    } .shiny:active {
      background:
        linear-gradient(to top, #357CD8 20%, #2B63C6) padding-box,
        linear-gradient(to top, #007fff 50%, #4facfe) border-box;
    }
  </style>
</head>
<body>
  <div class="body">
    <p style="font-size: 20px;">Here's some stuff that are not useless, but not really important to the general web surfing experience:</p>
    <ul>
      <li>nothing lol</li>
    </ul>
    <br>
    <p>...and that's all :)</p>
    <br><br><br><br><br><br>
    <div class="shiny">
      This &lt;div&gt; does nothing even if you click on it
    </div>
  </div>
  <script>
    initBFWT("Homepage", [
      ["Google Drive Archive", "/BFWT/?gda-redirect=all", "Hey it rhymes!"],
      ["Read now!", "/BFWT/read", "Read the comics on the website instead of on Google Drive"]
    ]);
  </script>
</body>
</html>
