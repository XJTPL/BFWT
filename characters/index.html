<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BFWT Character Guide</title>
  <script src="/BFWT/init.js"></script>
  <style>
    #body {
      padding: 8px;
      img {
        width: 180px;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <div id="body">
    <p>
      Forgot who that one character is? Read it up here! (or dont cuz i havent wrote anything here yet lol)
    </p>
  </div>
  <script>
    initBFWT("Character Guide", homepage_links);
    
    bodyDiv = document.getElementById("body");
    getFile("names.json", response => response.json().then(list => list.forEach(name => {
      const image = document.createElement("img");
      image.src = `https://raw.githubusercontent.com/XJTPL/BFWT-archive/main/standalone-artworks/character-guide-pictures/${name}.png`;
      image.alt = name;
      image.title = name;
      image.onclick = () => {url.searchParams.set('name', name);}; 
      image.style = "cursor: pointer;"
      bodyDiv.append(image);
    })));
  </script>
</body>
</html>
