<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BFWT Character Guide</title>
  <link href='https://fonts.googleapis.com/css?family=Comfortaa' rel='stylesheet'>
  <script src="/BFWT/init.js"></script>
  <style>
    #body {
      padding: 8px;
    }
    #welcomo {
      img {
        width: 160px;
        height: auto;
      }
    }
    #stuff {
      font-family: Verdana, sans-serif;
      padding-top: 8px;
    }
    #infobox {
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }
    #picture {
      width: calc(100% / 3);
      max-width: 400px;
      height: auto;
      border: 5px double grey;
      border-radius: 15px;
    }
    #name {
      font: bold clamp(2em, 10vw, 6em) 'Times New Roman', serif;
    }
    #infos {
      font-family: 'Comfortaa', sans-serif;
    }
    #desc {
      text-indent: 3em;
    }
  </style>
</head>
<body>
  <div id="body">
    <div id="welcomo">
      <h1 style="text-align: center; font-family: 'Comfortaa', sans-serif;">
        Forgot who that one character is? Read it up here!
      </h1>
      <p style="text-align: center;">(Click on a the picture of a character below)</p>
    </div>
    <div id="stuff">
      <div id="infobox">
        <img id="picture" src="https://github.com/XJTPL/BFWT-archive/blob/main/standalone-artworks/character-guide-pictures/Hammerpop.png?raw=true">
        <div>
          <div id="name">Hammerpop</div>
          <ul id="infos">
            <li>Male | He/Him</li>
            <li><b>First appearance:</b> Season 4: BFWTYW (lost)</li>
            <li><b>First debut:</b> Season 8: BFWTCC (upcoming)</li>
          </ul>
        </div>
      </div>
      <div id="desc">
        <p>Same-age cousin of Token</p>
      </div>
      <button type="button" onclick="updel('name')" style="display: block; margin: 32px 0px 64px auto;">Go back</button>
    </div>
  </div>
  <script>
    initBFWT("Character Guide", homepage_links, true);
    
    welcomeDiv = document.getElementById("welcomo");
    var imagesLoaded = false;
    function loadImages() {
      imagesLoaded = true;
      getFile("names.json", response => response.json().then(list => list.forEach(name => {
        const image = document.createElement("img");
        image.src = "https://raw.githubusercontent.com/XJTPL/BFWT-archive/main/standalone-artworks/character-guide-pictures/" + name + ".png";
        image.alt = name;
        image.title = name;
        image.onclick = () => {upset("name", name);};
        image.style = "cursor: pointer;"
        welcomeDiv.append(image);
      })));
    }

    function load(event) {
      if (uphas("name")) {
        document.title = upget("name") + " | BFWT Character Guide";
      } else {
        document.title = "BFWT Character Guide"
      }
    }

    window.addEventListener('upupdate', load);
    window.addEventListener('popstate', load);
  </script>
</body>
</html>
